name: Build

# Every push to main, manual runs, tagged releases, and any
# newly-created branch (e.g. "v1.1.1" cut off main) — these are full
# desktop/mobile builds (CMake for the desktop apps, Gradle for Android), so
# they deliberately don't run on PRs or pushes to other branches.
#
# `create` fires for both new branches and new tags, and a `git push` of
# a new tag fires `create` *and* `push` for the same ref — so every job
# below is gated with an `if` that only lets `create` through for branch
# creation, to avoid double runs on tag pushes. It is NOT restricted to
# version-looking branch names, so it runs on every new branch, not just
# release ones — add `&& startsWith(github.event.ref, 'v')` to each `if`
# below if you'd rather limit it to branches named like "v1.1.1".
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*"
  create:

jobs:
  # Gate: every test suite, run quickly against system libraries (about two minutes), so
  # a broken change never reaches the slow release builds below, which wait on it via
  # `needs: test`. The platform jobs then run the same tests again against their own
  # release configuration.
  test:
    name: Test
    runs-on: ubuntu-22.04
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      # System OpenCV + SQLite keep this fast; without them CMake builds a minimal
      # OpenCV from source (see native/cmake/Deps.cmake), which is what the platforms
      # without a system copy do.
      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb libcurl4-openssl-dev zlib1g-dev

      # Every C++ module's tests: cardvec, cardnet (pure parts), cardlog, cardpaths, cardstore, cardhttp,
      # cardauth, cardtext, cardcatalog, cardscan, cardonnx (against a real ONNX Runtime, downloaded at
      # configure time), cardview (a real window under xvfb), and the binder API driven over real HTTP.
      - name: C++ module tests (ctest)
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
          # the window test needs a display
          xvfb-run -a ctest --test-dir build/native --output-on-failure

  # The ONNX models the scanner loads (native/cardnet/export has the converters): the DINOv2 art embedder and
  # the PaddleOCR text detector/recognizer. Converting them needs PyTorch / paddle2onnx, so this is the one job that
  # uses Python; the desktop jobs below download its result and ship it inside the zips. (The card detector isn't
  # here: it needs a trained YOLO checkpoint, which doesn't exist yet. Without it the app finds cards by contours.)
  models:
    name: Models
    runs-on: ubuntu-22.04
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: models
          key: models-${{ hashFiles('native/cardnet/export/*.py', 'native/cardnet/assets/en_dict.txt') }}-v1

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Convert the models
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install onnx "paddle2onnx<2"
          mkdir -p models work
          python native/cardnet/export/export_dino.py --output models/dinov2_vits14.onnx

          # PaddleOCR's English detection + recognition inference models (the .pdmodel/.pdiparams pairs)
          curl -fsSL -o work/det.tar https://paddleocr.bj.bcebos.com/PP-OCRv3/english/en_PP-OCRv3_det_infer.tar
          curl -fsSL -o work/rec.tar https://paddleocr.bj.bcebos.com/PP-OCRv4/english/en_PP-OCRv4_rec_infer.tar
          mkdir work/det work/rec
          tar -xf work/det.tar -C work/det --strip-components=1
          tar -xf work/rec.tar -C work/rec --strip-components=1
          python native/cardnet/export/export_paddleocr.py --det-model-dir work/det --rec-model-dir work/rec --output-dir models

      # The recognizer's class count has to match ocr_dict.txt (95 characters + the CTC blank).
      - name: Check the models
        run: |
          pip install onnx
          python - <<'PY'
          import onnx
          for name in ("dinov2_vits14", "ocr_det", "ocr_rec"):
              m = onnx.load(f"models/{name}.onnx")
              dims = [[d.dim_value or d.dim_param for d in o.type.tensor_type.shape.dim] for o in m.graph.output]
              print(name, "outputs", dims)
              if name == "ocr_rec":
                  assert dims[0][-1] == 96, f"ocr_rec has {dims[0][-1]} classes, ocr_dict.txt needs 96"
              if name == "dinov2_vits14":
                  assert dims[0][-1] == 384, dims
          PY
          ls -l models

      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models
          if-no-files-found: error

  # The desktop apps. Each one builds in Release with OpenCV and SQLite linked statically (so the
  # app doesn't depend on system copies), runs the same tests on its own platform, installs into the
  # shipped layout and zips it. Dependencies that CMake downloads and compiles (OpenCV, ONNX Runtime,
  # webview, ...) live in .deps/, which is cached so only the first run pays for compiling OpenCV.

  windows:
    name: Windows
    needs: [test, models]
    runs-on: windows-latest
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      # Shipped as the app's data/ (the app copies it into the user's data directory on first launch). Must be in
      # place before CMake configures, which is when the install rules look at that folder.
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: native/binder/packaging/bundled_data

      - uses: actions/cache@v4
        with:
          path: .deps
          key: windows-deps-${{ hashFiles('native/cmake/Deps.cmake') }}

      - name: Configure
        run: cmake -S native -B build -DBINDER_STATIC_DEPS=ON -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.deps"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component binder --prefix dist
          Compress-Archive -Path dist/Binder -DestinationPath Binder-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Binder-windows
          path: Binder-windows.zip
          if-no-files-found: error

  macos:
    name: macOS
    needs: [test, models]
    runs-on: macos-latest
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      # Shipped as the app's data/ (the app copies it into the user's data directory on first launch). Must be in
      # place before CMake configures, which is when the install rules look at that folder.
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: native/binder/packaging/bundled_data

      - uses: actions/cache@v4
        with:
          path: .deps
          key: macos-deps-${{ hashFiles('native/cmake/Deps.cmake') }}

      - name: Configure
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release -DBINDER_STATIC_DEPS=ON \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.deps"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # macos-latest runners are arm64, so this .app only runs on Apple Silicon Macs — named accordingly rather
      # than as a plain universal "Binder-macos" build. It's also unsigned/unnotarized; see app/BUILD.md's macOS
      # section for what that means for anyone who downloads it.
      - name: Package
        run: |
          cmake --install build --component binder --prefix dist
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Binder.app ../Binder-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Binder-macos-arm64
          path: Binder-macos-arm64.zip
          if-no-files-found: error

  linux:
    name: Linux
    needs: [test, models]
    # Built on the oldest runner that has WebKitGTK 4.1, so the binary's glibc requirement stays low.
    runs-on: ubuntu-22.04
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      # Shipped as the app's data/ (the app copies it into the user's data directory on first launch). Must be in
      # place before CMake configures, which is when the install rules look at that folder.
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: native/binder/packaging/bundled_data

      - name: Install the window's GTK/WebKit libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - uses: actions/cache@v4
        with:
          path: .deps
          key: linux-deps-${{ hashFiles('native/cmake/Deps.cmake') }}

      - name: Configure
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release -DBINDER_STATIC_DEPS=ON \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.deps"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      # Running the app needs GTK 3 and WebKitGTK 4.1 installed (libwebkit2gtk-4.1-0 on Debian/Ubuntu).
      - name: Package
        run: |
          cmake --install build --component binder --prefix dist
          cd dist
          zip -ry ../Binder-linux.zip Binder

      - uses: actions/upload-artifact@v4
        with:
          name: Binder-linux
          path: Binder-linux.zip
          if-no-files-found: error

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an SDK; setup-android's default
      # package list includes the legacy "tools" package, which sdkmanager
      # no longer has, so install nothing extra and just accept licenses
      # (Gradle/AGP downloads the platform + build-tools it needs).
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The native backend is built by CMake through the NDK, once per ABI; OpenCV is by far the slow part, and
      # the CMake build directories hold it, so cache them.
      - uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: android-cxx-${{ hashFiles('native/cmake/Deps.cmake') }}

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Binder-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Publishes the finished builds to a GitHub release, once all four platforms have built (and passed their tests):
  #   - pushing a tag like v1.2.0 creates a normal release for that tag
  #   - every push to main refreshes the rolling "latest" pre-release with that commit's builds
  # Branch creations and manual runs build and upload artifacts but don't publish.
  release:
    name: Release
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write  # create the release and its tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts  # one folder per artifact

      - name: Collect the release files
        run: |
          mkdir release
          cp artifacts/Binder-windows/Binder-windows.zip release/
          cp artifacts/Binder-macos-arm64/Binder-macos-arm64.zip release/
          cp artifacts/Binder-linux/Binder-linux.zip release/
          cp artifacts/Binder-android-debug/app-debug.apk release/Binder-android-debug.apk
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # this job has no checkout for gh to infer the repository from
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            gh release create "${GITHUB_REF_NAME}" release/* \
              --title "Binder ${GITHUB_REF_NAME}" --generate-notes
          else
            # replace the previous rolling release (and its tag) with this commit's builds
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest release/* --prerelease --target "${GITHUB_SHA}" \
              --title "Latest build (main)" \
              --notes "Automated build of ${GITHUB_SHA} from \`main\`: Windows, macOS (Apple Silicon, unsigned), Linux and an unsigned Android debug APK. See BUILDING.md for what each needs to run."
          fi
